<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d"><title id="t">Alerta CasoAberto: risco do pagamento antecipado</title><desc id="d">O caso Roma Mobili documenta riscos do setor. Comparação com reclamação Florense Ipanema sem alegar falência da Florense.</desc><rect width="1080" height="1350" fill="#8c322a"/><rect x="60" y="60" width="960" height="3" fill="#d6a49b"/><text x="60" y="115" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800" fill="#fff">CASO<tspan fill="#ffe2ae">ABERTO</tspan></text><text x="60" y="210" font-family="Inter,Arial,sans-serif" font-size="23" letter-spacing="3" fill="#ffcfbf">ALERTA · MÓVEIS PLANEJADOS</text><text x="57" y="390" font-family="Inter,Arial,sans-serif" font-size="100" font-weight="900" fill="#fff" letter-spacing="-5">NÃO ASSUMA</text><text x="57" y="493" font-family="Inter,Arial,sans-serif" font-size="100" font-weight="900" fill="#fff" letter-spacing="-5">ESSE RISCO.</text><rect x="60" y="555" width="960" height="4" fill="#f1b595"/><text x="60" y="650" font-family="Inter,Arial,sans-serif" font-size="43" font-weight="700" fill="#fff">Na dúvida, procure</text><text x="60" y="710" font-family="Inter,Arial,sans-serif" font-size="43" font-weight="700" fill="#fff">outro fornecedor.</text><text x="60" y="825" font-family="Inter,Arial,sans-serif" font-size="30" fill="#ffebe4">Roma Mobili: falência decretada</text><text x="60" y="868" font-family="Inter,Arial,sans-serif" font-size="30" fill="#ffebe4">em 19/12/2025 (TJRJ).</text><text x="60" y="955" font-family="Inter,Arial,sans-serif" font-size="30" fill="#ffebe4">Florense Ipanema: consumidor relata</text><text x="60" y="998" font-family="Inter,Arial,sans-serif" font-size="30" fill="#ffebe4">R$ 190 mil pagos e atraso.</text><rect x="60" y="1082" width="960" height="1" fill="#d8a6a0"/><text x="60" y="1135" font-family="Inter,Arial,sans-serif" font-size="21" fill="#fff">Casos distintos. A falência da Roma não</text><text x="60" y="1165" font-family="Inter,Arial,sans-serif" font-size="21" fill="#fff">significa falência da Florense.</text><text x="60" y="1245" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800" fill="#fff">casoaberto.pages.dev</text></svg>