# Configuration TEMPLATE ONLY. Do not deploy without replacing every placeholder,
# creating a D1 database, setting a private custom domain behind Access,
# and adding the IDENTITY_PEPPER secret with Wrangler or the Cloudflare dashboard.
name = "casoaberto-private-cause-api"
main = "src/worker.mjs"
compatibility_date = "2026-11-09"
workers_dev = false

[vars]
ACCESS_TEAM_DOMAIN = "REPLACE.cloudflareaccess.com"
ACCESS_AUDIENCE = "REPLACE_WITH_THE_VERIFIED_ACCESS_AUD_TAG"
CAUSE_APP_ORIGIN = "https://REPLACE_WITH_ACCESS_PROTECTED_PRIVATE_ORIGIN"

[[d1_databases]]
binding = "DB"
database_name = "REPLACE_WITH_PRIVATE_D1_DATABASE_NAME"
database_id = "REPLACE_WITH_ACTUAL_D1_UUID"
migrations_dir = "migrations"

[[ratelimits]]
name = "API_RATE_LIMIT"
namespace_id = "REPLACE_WITH_UNIQUE_POSITIVE_NAMESPACE_ID"
[ratelimits.simple]
limit = 60
period = 60
